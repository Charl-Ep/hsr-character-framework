# Copy to http-settings.cfg beside Hksr.CharacterFramework.dll.
# Changes apply without restarting the game. Saving settings stops old clients.
# Generate your own random access token before setting enabled=true.
# Plain HTTP: use only on a trusted local network, never expose to the Internet.
[http]
enabled=false
address=127.0.0.1
port=39270
token=
# Optional exact browser origins, comma separated. No wildcard or trailing slash.
origins=
